<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Prato</title>
</head>
<body>

    <h1>Cadastrar Prato</h1>

    <form id="formulario">

        <input
            type="text"
            id="nome"
            placeholder="Nome"
            required
        >

        <br><br>

        <input
            type="text"
            id="descricao"
            placeholder="Descrição"
        >

        <br><br>

        <input
            type="number"
            id="preco"
            placeholder="Preço"
            step="0.01"
            required
        >

        <br><br>

        <select id="categoria" required>
            <option value="">Selecione uma categoria</option>
        </select>

        <br><br>

        <button type="submit">
            Cadastrar
        </button>

    </form>

    <p id="mensagem"></p>

    <script src="js/cadastro.js"></script>

</body>
</html>
